<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Selected Menu - MOX VOX</title>
    <style>
        body {
            background-color: #080808;
            color: #efe6cf;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-top: 40px;
        }
        h1 {
            color: #D4AF37;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .menu-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .menu-list li {
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .menu-list li:last-child {
            border-bottom: none;
        }
        .menu-list li::before {
            content: "• ";
            color: #D4AF37;
            margin-right: 8px;
        }
        .empty-msg {
            text-align: center;
            color: rgba(239, 230, 207, 0.5);
            font-size: 1.1rem;
        }
        @media (max-width: 600px) {
            .container {
                padding: 20px;
                margin-top: 20px;
            }
            h1 {
                font-size: 1.5rem;
            }
            .menu-list li {
                font-size: 1rem;
                padding: 8px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Your Selected Menu</h1>
        <ul class="menu-list" id="menuList"></ul>
        <p class="empty-msg" id="emptyMsg" style="display:none;">No menu items found.</p>
    </div>
    <script>
        var params = new URLSearchParams(window.location.search);
        var items = params.get("items");
        var list = document.getElementById("menuList");
        var emptyMsg = document.getElementById("emptyMsg");
        if (items) {
            var decoded = decodeURIComponent(items);
            var arr = decoded.split("|").filter(function(s) { return s.trim() !== ""; });
            if (arr.length > 0) {
                for (var i = 0; i < arr.length; i++) {
                    var li = document.createElement("li");
                    li.textContent = arr[i];
                    list.appendChild(li);
                }
            } else {
                emptyMsg.style.display = "block";
            }
        } else {
            emptyMsg.style.display = "block";
        }
    </script>
</body>
</html>
